<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="generator" content="PresentationGenerator">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 100px;
        }
        
        .slide {
            display: none;
            animation: fadeIn .5s;
        }
        
        .slide.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .slide-header {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(233, 69, 96, .3);
        }
        
        .slide-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .slide-header .subtitle {
            font-size: 1.2em;
            opacity: .9;
        }
        
        .slide-content {
            background: rgba(255, 255, 255, .1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            line-height: 2;
            font-size: 1.15em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
        }
        
        .slide-content > div {
            margin-bottom: 10px;
        }
        
        .slide-content > div:last-child {
            margin-bottom: 0;
        }
        
        .slide-content a {
            color: #feca57;
        }
        
        .slide-content a:hover {
            color: #fff;
        }
        
        .slide-content table tr:nth-child(even) {
            background: rgba(255, 255, 255, .05);
        }
        
        .slide-content table tr:hover {
            background: rgba(255, 255, 255, .1);
        }
        
        .navigation {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 52, 96, .95);
            backdrop-filter: blur(10px);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, .3);
        }
        
        .nav-btn {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all .3s;
            font-weight: bold;
        }
        
        .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(233, 69, 96, .4);
        }
        
        .nav-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        
        .page-indicator {
            background: rgba(255, 255, 255, .1);
            color: #feca57;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            min-width: 120px;
            text-align: center;
        }
        
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #e94560, #feca57);
            transition: width .3s;
            z-index: 1000;
        }
        
        .blackout {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
        }
        
        .blackout.on {
            display: block;
        }
        
        {#- 列印版面：每張投影片一頁 16:9。@media print 用於實際列印，
            html.print-layout 讓 beforeprint 時能在螢幕上量測同樣的版面 #}
        {%- macro print_rules(root) %}
        {{ root }} body {
            background: none;
        }
        
        {{ root }} .container {
            max-width: none;
            margin: 0;
            padding: 0;
        }
        
        {{ root }} .slide {
            display: block;
            width: 13.333in;
            height: 7.5in;
            padding: 0.35in 0.5in;
            box-sizing: border-box;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            animation: none;
            break-after: page;
        }
        
        {{ root }} .slide:last-child {
            break-after: auto;
        }
        
        {{ root }} .navigation,
        {{ root }} .progress-bar,
        {{ root }} .blackout,
        {{ root }} .slide button {
            display: none !important;
        }
        {%- endmacro %}
        
        @page {
            size: 13.333in 7.5in;
            margin: 0;
        }
        
        @media print {
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            {{ print_rules('html') }}
        }
        {{ print_rules('html.print-layout') }}
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    <div class="container">
        {% for slide_html in slides %}
        {{ slide_html|safe }}
        {% endfor %}
    </div>
    
    <div class="navigation">
        <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">◀ 上一張</button>
        <div class="page-indicator" id="pageIndicator">1 / {{ slides|length }}</div>
        <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">下一張 ▶</button>
    </div>
    
    <div class="blackout" id="blackout"></div>
    
    <script>
        let currentIndex = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        
        function showSlide(index) {
            currentIndex = index;
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            
            document.getElementById('pageIndicator').textContent = `${index + 1} / ${totalSlides}`;
            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === totalSlides - 1);
            
            const progress = ((index + 1) / totalSlides) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            
            window.scrollTo(0, 0);
            fitTrees(slides[index]);
            
            // 網址 hash 記住目前頁數（1 起算），不留下瀏覽紀錄
            history.replaceState(null, '', '#' + (index + 1));
        }
        
        function goToSlide(index) {
            showSlide(Math.max(0, Math.min(totalSlides - 1, index)));
        }
        
        // 從網址 hash 讀頁數，不合法時回到第一張
        function indexFromHash() {
            const page = parseInt(location.hash.slice(1), 10);
            return (page >= 1 && page <= totalSlides) ? page - 1 : 0;
        }
        
        // 還沒捲到底（頂）時先捲一個畫面，已經在底（頂）才翻頁
        function scrollOrChange(direction) {
            const root = document.documentElement;
            const navHeight = document.querySelector('.navigation').offsetHeight;
            const step = Math.max((window.innerHeight - navHeight) * 0.9, 50);
            const atTop = window.scrollY <= 1;
            const atBottom = window.scrollY + window.innerHeight >= root.scrollHeight - 1;
            if (direction > 0 && !atBottom) {
                window.scrollBy({top: step, behavior: 'instant'});
            } else if (direction < 0 && !atTop) {
                window.scrollBy({top: -step, behavior: 'instant'});
            } else {
                changeSlide(direction);
            }
        }
        
        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen();
            }
        }
        
        // 樹狀圖比卡片寬時等比例縮小，不超出也不出現捲軸
        function fitTrees(slide) {
            slide.querySelectorAll('.tree').forEach(tree => {
                const body = tree.firstElementChild;
                let zoom = 1;
                body.style.zoom = '';
                // 縮小後框線會取整到至少 1px，所以量測後再修正幾次
                for (let i = 0; i < 5; i++) {
                    const ratio = tree.clientWidth / body.getBoundingClientRect().width;
                    if (ratio >= 1) break;
                    zoom = Math.floor(zoom * ratio * 1000) / 1000;
                    body.style.zoom = zoom;
                }
            });
        }
        
        function changeSlide(direction) {
            goToSlide(currentIndex + direction);
        }
        
        function copyCode(codeId) {
            const codeElement = document.getElementById('code' + codeId);
            const btn = document.getElementById('copyBtn' + codeId);
            
            if (!codeElement) return;
            
            // 取得原始程式碼（解碼 HTML 實體）
            const code = codeElement.textContent;
            
            // 複製到剪貼簿
            navigator.clipboard.writeText(code).then(() => {
                // 成功提示
                const originalText = btn.textContent;
                btn.textContent = '已複製';
                btn.style.background = '#00d4aa';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#4ecdc4';
                }, 2000);
            }).catch(err => {
                // 失敗提示
                console.error('複製失敗:', err);
                btn.textContent = '複製失敗';
                btn.style.background = '#ff6b6b';
                
                setTimeout(() => {
                    btn.textContent = '複製';
                    btn.style.background = '#4ecdc4';
                }, 2000);
            });
        }
        
        // 翻頁器送 PageUp / PageDown
        const navigationKeys = {
            'ArrowRight': () => changeSlide(1),
            'ArrowLeft': () => changeSlide(-1),
            'ArrowDown': () => scrollOrChange(1),
            ' ': () => scrollOrChange(1),
            'PageDown': () => scrollOrChange(1),
            'ArrowUp': () => scrollOrChange(-1),
            'PageUp': () => scrollOrChange(-1),
            'Home': () => goToSlide(0),
            'End': () => goToSlide(totalSlides - 1),
        };
        
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            const blackout = document.getElementById('blackout');
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            
            if (key === 'b') {
                blackout.classList.toggle('on');
            } else if (key === 'f') {
                toggleFullscreen();
            } else if (key in navigationKeys) {
                // 黑屏時翻頁鍵只恢復畫面，不換頁（比照 PowerPoint）
                if (blackout.classList.contains('on')) {
                    blackout.classList.remove('on');
                } else {
                    navigationKeys[key]();
                }
            } else {
                return;
            }
            // 避免瀏覽器預設的捲動，以及焦點在按鈕上時空白鍵再觸發一次點擊
            e.preventDefault();
        });
        
        window.addEventListener('hashchange', () => showSlide(indexFromHash()));
        
        // 列印：所有投影片套用列印版面，縮放樹狀圖，太高的投影片等比例縮小放進一頁
        function fitSlideToPage(slide) {
            const parts = [...slide.children];
            const style = getComputedStyle(slide);
            const available = slide.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
            let zoom = 1;
            for (let i = 0; i < 5; i++) {
                const needed = slide.scrollHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
                if (needed <= available + 1) break;
                zoom = Math.floor(zoom * (available / needed) * 1000) / 1000;
                parts.forEach(part => part.style.zoom = zoom);
            }
        }
        
        window.addEventListener('beforeprint', () => {
            document.documentElement.classList.add('print-layout');
            slides.forEach(slide => {
                fitTrees(slide);
                fitSlideToPage(slide);
            });
        });
        
        window.addEventListener('afterprint', () => {
            document.documentElement.classList.remove('print-layout');
            slides.forEach(slide => [...slide.children].forEach(part => part.style.zoom = ''));
            fitTrees(slides[currentIndex]);
        });
        
        window.addEventListener('resize', () => fitTrees(slides[currentIndex]));
        document.fonts.ready.then(() => fitTrees(slides[currentIndex]));
        
        showSlide(indexFromHash());
    </script>
</body>
</html>
