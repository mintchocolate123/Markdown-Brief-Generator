[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "briefgen"
dynamic = ["version"]
description = "Markdown 轉 HTML 簡報生成器"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["jinja2>=3.1"]

[project.scripts]
briefgen = "briefgen.cli:main"

[tool.setuptools.dynamic]
version = { attr = "briefgen.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefgen = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
