name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 從 2026-10-19 起指向 Ubuntu 26，字型可能換掉而改變 e2e 的尺寸量測，
        # 所以固定版本（理由見 docs/開發.md 的 CI 一節）
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium for browser tests (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium for browser tests (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Run tests
        run: python -m pytest
        env:
          BRIEFGEN_REQUIRE_E2E: "1"
